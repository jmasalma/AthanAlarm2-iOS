name: iOS CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag version (e.g. v1.0.0). Leave as default to publish a release.'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release iOS IPA
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select Xcode Version
      run: |
        if [ -d "/Applications/Xcode_16.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer
        elif [ -d "/Applications/Xcode_15.4.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
        elif [ -d "/Applications/Xcode_15.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_15.app/Contents/Developer
        fi
        xcodebuild -version

    - name: Resolve Swift Package Dependencies
      run: |
        if [ -f "AthanAlarm2.xcodeproj/project.pbxproj" ]; then
          xcodebuild -resolvePackageDependencies -project AthanAlarm2.xcodeproj
        fi

    - name: Build and Archive iOS App
      run: |
        mkdir -p build-output
        xcodebuild archive \
          -project AthanAlarm2.xcodeproj \
          -scheme AthanAlarm2 \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build-output/AthanAlarm2.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package Sideloadable IPA (AltStore / TrollStore)
      run: |
        mkdir -p Payload
        cp -R build-output/AthanAlarm2.xcarchive/Products/Applications/*.app Payload/
        zip -qr AthanAlarm2.ipa Payload
        mkdir -p release-artifacts
        mv AthanAlarm2.ipa release-artifacts/AthanAlarm2.ipa
        ls -lh release-artifacts/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthanAlarm2-IPA
        path: release-artifacts/AthanAlarm2.ipa

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
        files: release-artifacts/AthanAlarm2.ipa
        generate_release_notes: true
