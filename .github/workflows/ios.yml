name: iOS CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Specific Version number (e.g. 1.2.3 or v1.2.3). Leave blank to auto-increment patch.'
        required: false
        default: ''
        type: string
      bump_type:
        description: 'If version number above is left blank, choose how to increment:'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build:
    name: Build & Release iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate Next Version Number
      id: version_calc
      run: |
        MANUAL_VERSION="${{ github.event.inputs.version_number }}"
        MANUAL_VERSION=$(echo "$MANUAL_VERSION" | xargs)

        # 1. If user explicitly entered a version number, use it directly
        if [ -n "$MANUAL_VERSION" ]; then
          # Strip leading 'v' if present for clean semantic numbers
          CLEAN_VERSION="${MANUAL_VERSION#v}"
          TAG="v${CLEAN_VERSION}"
          echo "Using manually specified version: $TAG ($CLEAN_VERSION)"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          exit 0
        fi

        # 2. Otherwise, fetch git tags and calculate the next version
        git fetch --tags --force 2>/dev/null || true

        # Find latest semantic version tag
        LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)

        if [ -z "$LATEST_TAG" ]; then
          # Fallback check for any v* tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
        fi

        echo "Latest tag found: $LATEST_TAG"

        # If current commit already has an exact tag, reuse it (only on push)
        EXACT_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+' | head -n 1 || true)
        if [ -n "$EXACT_TAG" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          echo "Current commit has exact tag: $EXACT_TAG"
          echo "tag_name=$EXACT_TAG" >> $GITHUB_OUTPUT
          echo "release_version=${EXACT_TAG#v}" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Clean tag prefix
        RAW_VERSION="${LATEST_TAG#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VERSION"
        MAJOR=${MAJOR:-1}
        MINOR=${MINOR:-0}
        PATCH=${PATCH:-0}

        BUMP_CHOICE="${{ github.event.inputs.bump_type }}"
        # Default to patch if blank
        if [ -z "$BUMP_CHOICE" ]; then
          BUMP_CHOICE="patch"
        fi

        case "$BUMP_CHOICE" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch|*)
            PATCH=$((PATCH + 1))
            ;;
        esac

        NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
        echo "Calculated next tag: $NEXT_TAG"
        echo "tag_name=$NEXT_TAG" >> $GITHUB_OUTPUT
        echo "release_version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

    - name: Select Xcode Version
      run: |
        if [ -d "/Applications/Xcode_16.2.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_16.2.app/Contents/Developer
        elif [ -d "/Applications/Xcode_16.1.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_16.1.app/Contents/Developer
        elif [ -d "/Applications/Xcode_16.0.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
        elif [ -d "/Applications/Xcode_16.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer
        elif [ -d "/Applications/Xcode_15.4.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
        elif [ -d "/Applications/Xcode_15.app" ]; then
          sudo xcode-select -switch /Applications/Xcode_15.app/Contents/Developer
        fi
        echo "Selected Xcode:"
        xcodebuild -version

    - name: Resolve Swift Package Dependencies
      run: |
        if [ -f "AthanAlarm2.xcodeproj/project.pbxproj" ]; then
          xcodebuild -resolvePackageDependencies -project AthanAlarm2.xcodeproj
        fi

    - name: Build and Archive iOS App
      run: |
        VERSION_NUMBER="${{ steps.version_calc.outputs.release_version }}"
        BUILD_NUMBER="${{ github.run_number }}"
        echo "Building AthanAlarm2 version $VERSION_NUMBER ($BUILD_NUMBER)..."

        mkdir -p build-output
        xcodebuild archive \
          -project AthanAlarm2.xcodeproj \
          -scheme AthanAlarm2 \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build-output/AthanAlarm2.xcarchive \
          MARKETING_VERSION="$VERSION_NUMBER" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package Sideloadable IPA (AltStore / TrollStore / Sideloadly)
      run: |
        mkdir -p Payload
        cp -R build-output/AthanAlarm2.xcarchive/Products/Applications/*.app Payload/
        zip -qr AthanAlarm2.ipa Payload
        mkdir -p release-artifacts
        mv AthanAlarm2.ipa release-artifacts/AthanAlarm2.ipa
        ls -lh release-artifacts/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthanAlarm2-${{ steps.version_calc.outputs.tag_name }}
        path: release-artifacts/AthanAlarm2.ipa

    - name: Create GitHub Release & Tag
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ steps.version_calc.outputs.tag_name }}
        name: "AthanAlarm2 iOS ${{ steps.version_calc.outputs.tag_name }}"
        files: release-artifacts/AthanAlarm2.ipa
        generate_release_notes: true
